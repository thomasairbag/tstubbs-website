# CHECK at Stage 5, together with the Home field line.
description: >-
  Thomas Stubbs is Professor of Global Political Economy at Royal Holloway,
  University of London. He researches the International Monetary Fund and
  global economic governance, and undertakes commissioned research and
  advisory work for international organisations, governments, and civil
  society.

# Home, "Areas of expertise" (plan Section 5). The headings are the plan's;
# each line is a first draft for Thomas to rewrite.
# The sixth area was added on 6 November 2026 (decision 14; the 2021 World
# Development and 2026 International Interactions papers).
expertise:
  - heading: IMF lending and conditionality
    text: What the IMF requires of borrowing governments, and whether and how those conditions are carried out.
  - heading: Social spending and social protection
    text: How fiscal adjustment affects social protection and health, and what IMF social spending floors achieve.
  - heading: Climate and the international financial institutions
    text: How the IMF has brought climate change into its surveillance, lending, and technical assistance.
  - heading: Crisis finance and the global financial safety net
    text: How the safety net of IMF resources, regional financing arrangements, and central bank swap lines responds to crises, and how far it reaches developing countries.
  - heading: Fiscal policy and development
    text: Tax advice, austerity, and public spending in low- and middle-income countries.
  - heading: Data and policy evaluation
    text: Original datasets built from institutional documents, IMF Monitor among them, and quantitative evaluation of policy effects.
